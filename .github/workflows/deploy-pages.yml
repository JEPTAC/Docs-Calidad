name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate additive Word Studio JavaScript
        run: |
          for f in word-studio-01-core.js word-studio-02-editor.js word-studio-03-render.js word-studio-04-bind.js word-studio-05-docx.js word-studio-06-ui.js word-studio-07-premium.js word-studio-08-sgc-details.js word-studio-09-structure.js word-studio-10-horizontal-flow.js; do
            node --check "$f"
          done

      - name: Lock approved SGC baseline
        run: |
          test "$(git hash-object index.html)" = "1c507f6e851d9333760178c20d95d5f7a1436bda"
          test "$(git hash-object procedimiento/index.html)" = "40e201d86fbc38a759109487da1288e5699b022d"
          test -f assets/intro.mp4
          test -f assets/happy-cat.gif
          test -f assets/footer-ei-calidad.png

      - name: Validate SGC visual contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          html = Path('index.html').read_text(encoding='utf-8')
          pro = Path('word-studio-pro.css').read_text(encoding='utf-8')
          premium = Path('word-studio-premium.css').read_text(encoding='utf-8')
          ext = Path('word-studio-extensions.css').read_text(encoding='utf-8')
          details = Path('word-studio-08-sgc-details.js').read_text(encoding='utf-8')
          structure = Path('word-studio-09-structure.js').read_text(encoding='utf-8')
          horizontal = Path('word-studio-10-horizontal-flow.js').read_text(encoding='utf-8')

          checks = {
              'bandas SGC azul/amarillo': r'\.sgc-section-title\{[^}]*background:#001F73;[^}]*color:#EAC800;',
              'subtitulo SGC azul 10.8pt': r'\.sgc-subsection-title\{[^}]*color:#001F73;[^}]*font-size:10\.8pt;',
              'cuerpo SGC 10.5pt': r'\.sgc-section-content\{[^}]*font-size:10\.5pt;',
              'TOC SGC 10.5pt': r'\.sgc-toc-row\{[^}]*color:#111;[^}]*font-size:10\.5pt;',
              'control cambios azul institucional': r'\.control-change-table th\{[^}]*background:#001F73;[^}]*color:#fff;',
          }
          for label, pattern in checks.items():
              if not re.search(pattern, html, re.S):
                  raise SystemExit(f'Contrato visual roto: {label}')

          for name, css in [('word-studio-pro.css', pro), ('word-studio-premium.css', premium), ('word-studio-extensions.css', ext)]:
              if re.search(r'\.sgc-[A-Za-z0-9_-]+', css):
                  raise SystemExit(f'{name} no puede redefinir clases base SGC')

          if '--word-body-size:10.5pt' not in premium:
              raise SystemExit('La tipografía premium debe usar 10.5pt')
          if '.word-control-change-table th{background:#001F73!important' not in premium:
              raise SystemExit('El control de cambios debe conservar azul #001F73')
          if '.word-toc-title{color:#001F73!important}' not in premium:
              raise SystemExit('El título de la tabla de contenido debe ser azul #001F73')
          if '.word-toc-dots{' not in premium or 'radial-gradient' not in premium:
              raise SystemExit('La tabla de contenido debe conservar líderes punteados')
          if 'word-toc-title' not in details or 'word-toc-dots' not in details:
              raise SystemExit('La capa V70 debe aplicar título azul y líderes punteados al TOC')

          if '--ei-blue:#001F73' not in ext:
              raise SystemExit('Las extensiones V71 deben usar azul institucional #001F73')
          for bad in ('#175CD3','#2F80ED','#001754','#0563C1'):
              if bad.lower() in ext.lower():
                  raise SystemExit(f'Azul no institucional detectado en extensiones: {bad}')
          if 'margin:0 0 2px!important' not in ext:
              raise SystemExit('El espacio entre párrafos debe permanecer compacto')
          if "V71_BLUE='#001F73'" not in structure:
              raise SystemExit('Diagramas V71 deben usar azul institucional #001F73')
          if "V72_BLUE='#001F73'" not in horizontal:
              raise SystemExit('Flujograma horizontal V72 debe usar azul institucional #001F73')
          for bad in ('#175CD3','#2F80ED','#001754','#0563C1'):
              if bad.lower() in horizontal.lower():
                  raise SystemExit(f'Azul no institucional detectado en flujograma V72: {bad}')
          if 'const gap=38' not in horizontal or 'v72NodeMetrics' not in horizontal:
              raise SystemExit('El layout horizontal V72 debe calcular tamaños y separaciones reales')
          if 'vector-effect="non-scaling-stroke"' not in horizontal:
              raise SystemExit('Los conectores V72 deben conservar grosor profesional al escalar')
          PY

      - name: Validate premium editor DOCX lists and diagrams
        run: |
          grep -q 'word-rich-editor' word-studio-07-premium.js
          grep -q 'premiumDocxRichParagraphs' word-studio-07-premium.js
          grep -q 'PREMIUM_BODY_SIZE_PT=10.5' word-studio-07-premium.js
          grep -q 'size:21' word-studio-07-premium.js
          grep -q 'size:21' word-studio-05-docx.js
          grep -q 'word-toc-dots' word-studio-08-sgc-details.js
          grep -q 'word-toc-title' word-studio-08-sgc-details.js
          grep -q 'word-control-change-table' word-studio-08-sgc-details.js
          grep -q "WORD_BLOCK_TYPES.includes('diagram')" word-studio-09-structure.js
          grep -q 'V71_BULLETS' word-studio-09-structure.js
          grep -q 'v71ConceptSvgData' word-studio-09-structure.js
          grep -q 'v71FlowSvgData' word-studio-09-structure.js
          grep -q "type:'svg'" word-studio-09-structure.js
          grep -q 'spacing:{after:40,line:276}' word-studio-09-structure.js
          grep -q 'v72HorizontalFlowSvgData' word-studio-10-horizontal-flow.js
          grep -q 'v72HorizontalNodeShape' word-studio-10-horizontal-flow.js

      - name: Validate original inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for name in ('index.html','procedimiento/index.html'):
              html=Path(name).read_text(encoding='utf-8')
              scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S|re.I)
              Path('/tmp/'+name.replace('/','_')+'.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/index.html.js
          node --check /tmp/procedimiento_index.html.js

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare approved baseline plus isolated Word Studio
        run: |
          mkdir -p _site
          rsync -av --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            ./ _site/
          python - <<'PY'
          from pathlib import Path
          p=Path('_site/index.html')
          html=p.read_text(encoding='utf-8')
          css='''
          <link rel="stylesheet" href="word-studio-pro.css?v=72">
          <link rel="stylesheet" href="word-studio-premium.css?v=72">
          <link rel="stylesheet" href="word-studio-extensions.css?v=72">
          '''
          scripts='''
          <script src="https://cdn.jsdelivr.net/npm/docx@9.7.1/dist/index.iife.js"></script>
          <script src="word-studio-01-core.js?v=72"></script>
          <script src="word-studio-02-editor.js?v=72"></script>
          <script src="word-studio-03-render.js?v=72"></script>
          <script src="word-studio-04-bind.js?v=72"></script>
          <script src="word-studio-05-docx.js?v=72"></script>
          <script src="word-studio-06-ui.js?v=72"></script>
          <script src="word-studio-07-premium.js?v=72"></script>
          <script src="word-studio-08-sgc-details.js?v=72"></script>
          <script src="word-studio-09-structure.js?v=72"></script>
          <script src="word-studio-10-horizontal-flow.js?v=72"></script>
          '''
          if 'word-studio-extensions.css?v=72' not in html:
              html=html.replace('</head>',css+'\n</head>')
          if 'word-studio-10-horizontal-flow.js?v=72' not in html:
              html=html.replace('</body>',scripts+'\n</body>')
          p.write_text(html,encoding='utf-8')
          PY
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
