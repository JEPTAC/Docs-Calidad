name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate additive Word Studio JavaScript
        run: |
          for f in word-studio-01-core.js word-studio-02-editor.js word-studio-03-render.js word-studio-04-bind.js word-studio-05-docx.js word-studio-06-ui.js word-studio-07-premium.js; do
            node --check "$f"
          done

      - name: Validate original baseline and assets
        run: |
          test -f index.html
          test -f procedimiento/index.html
          test -f word-studio-pro.css
          test -f word-studio-premium.css
          test -f assets/intro.mp4
          test -f assets/happy-cat.gif
          test -f assets/footer-ei-calidad.png
          grep -q 'sgc-header-ref' index.html
          grep -q 'left:.35in;right:.35in' index.html
          grep -q 'initIntroExperience' index.html
          grep -q 'word-rich-editor' word-studio-07-premium.js
          grep -q 'premiumDocxRichParagraphs' word-studio-07-premium.js

      - name: Validate original inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for name in ('index.html','procedimiento/index.html'):
              html=Path(name).read_text(encoding='utf-8')
              scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S|re.I)
              Path('/tmp/'+name.replace('/','_')+'.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/index.html.js
          node --check /tmp/procedimiento_index.html.js

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare original app plus additive Word Studio
        run: |
          mkdir -p _site
          rsync -av --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            ./ _site/
          python - <<'PY'
          from pathlib import Path
          p=Path('_site/index.html')
          html=p.read_text(encoding='utf-8')
          css='''
          <link rel="stylesheet" href="word-studio-pro.css?v=66">
          <link rel="stylesheet" href="word-studio-premium.css?v=66">
          '''
          scripts='''
          <script src="https://cdn.jsdelivr.net/npm/docx@9.7.1/dist/index.iife.js"></script>
          <script src="word-studio-01-core.js?v=66"></script>
          <script src="word-studio-02-editor.js?v=66"></script>
          <script src="word-studio-03-render.js?v=66"></script>
          <script src="word-studio-04-bind.js?v=66"></script>
          <script src="word-studio-05-docx.js?v=66"></script>
          <script src="word-studio-06-ui.js?v=66"></script>
          <script src="word-studio-07-premium.js?v=66"></script>
          '''
          if 'word-studio-premium.css?v=66' not in html:
              html=html.replace('</head>',css+'\n</head>')
          if 'word-studio-07-premium.js?v=66' not in html:
              html=html.replace('</body>',scripts+'\n</body>')
          p.write_text(html,encoding='utf-8')
          PY
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
