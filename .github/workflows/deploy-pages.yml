name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: |
          for f in \
            word-studio-01-core.js word-studio-02-editor.js word-studio-03-render.js \
            word-studio-04-bind.js word-studio-05-docx.js word-studio-23-design-studio.js word-studio-06-ui.js \
            word-studio-07-premium.js word-studio-08-sgc-details.js word-studio-09-structure.js \
            word-studio-10-horizontal-flow.js word-studio-11-flow-pro.js word-studio-12-diagram-builder.js \
            word-studio-13-immersive-ui.js word-studio-14-interactions.js word-studio-24-window-manager.js word-studio-15-ai-local.js \
            word-studio-16-document-import.js word-studio-17-ai-ui.js word-studio-18-ai-v84.js \
            word-studio-19-ai-v84-numbering.js word-studio-20-ai-v84-hierarchy.js \
            word-studio-21-ai-v86-smart.js word-studio-22-ai-v86-hardening.js; do
            node --check "$f"
          done
          node --check tests/ui-smoke.mjs
          node --check tests/window-manager-smoke.mjs
          node --check tests/ai-local-smoke.mjs
          node --check tests/ai-v84-smoke.mjs
          node --check tests/ai-v86-smoke.mjs

      - name: Protect approved SGC baseline
        run: |
          test "$(git hash-object index.html)" = "1c507f6e851d9333760178c20d95d5f7a1436bda"
          test "$(git hash-object procedimiento/index.html)" = "40e201d86fbc38a759109487da1288e5699b022d"
          test -f assets/intro.mp4
          test -f assets/footer-ei-calidad.png

      - name: Validate isolated visual contract, Design Studio and AI V86
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          html=Path('index.html').read_text(encoding='utf-8')
          css_names=[
            'word-studio-pro.css','word-studio-premium.css','word-studio-extensions.css',
            'word-studio-diagram-builder.css','word-studio-immersive.css','word-studio-workspace-v76.css',
            'word-studio-design-studio.css','word-studio-window-manager.css','word-studio-ai-local.css','word-studio-ai-v83-fix.css',
            'word-studio-ai-v84.css','word-studio-ai-v86.css'
          ]
          css={n:Path(n).read_text(encoding='utf-8') for n in css_names}
          files={
            'design':Path('word-studio-23-design-studio.js').read_text(encoding='utf-8'),
            'windows':Path('word-studio-24-window-manager.js').read_text(encoding='utf-8'),
            'core':Path('word-studio-15-ai-local.js').read_text(encoding='utf-8'),
            'import':Path('word-studio-16-document-import.js').read_text(encoding='utf-8'),
            'ui':Path('word-studio-17-ai-ui.js').read_text(encoding='utf-8'),
            'v84':Path('word-studio-18-ai-v84.js').read_text(encoding='utf-8'),
            'num':Path('word-studio-19-ai-v84-numbering.js').read_text(encoding='utf-8'),
            'hier':Path('word-studio-20-ai-v84-hierarchy.js').read_text(encoding='utf-8'),
            'v86':Path('word-studio-21-ai-v86-smart.js').read_text(encoding='utf-8'),
            'hard':Path('word-studio-22-ai-v86-hardening.js').read_text(encoding='utf-8'),
          }

          required=[
            (r'\.sgc-section-title\{[^}]*background:#001F73;[^}]*color:#EAC800;','bandas SGC'),
            (r'\.sgc-subsection-title\{[^}]*color:#001F73;[^}]*font-size:10\.8pt;','subtítulos SGC'),
            (r'\.sgc-section-content\{[^}]*font-size:10\.5pt;','cuerpo SGC'),
            (r'\.control-change-table th\{[^}]*background:#001F73;[^}]*color:#fff;','control cambios')
          ]
          for pattern,label in required:
            if not re.search(pattern,html,re.S): raise SystemExit(f'Contrato SGC roto: {label}')
          for name,txt in css.items():
            if re.search(r'\.sgc-[A-Za-z0-9_-]+',txt): raise SystemExit(f'{name} no puede redefinir clases SGC')
          for bad in ('#175CD3','#2F80ED','#001754','#0563C1'):
            if any(bad.lower() in txt.lower() for txt in list(css.values())+list(files.values())):
              raise SystemExit(f'Azul no institucional: {bad}')

          design_checks={
            'tipo de bloque':'design' in files['design'] and 'DS_ELEMENT_TYPES' in files['design'],
            'historial':'dsUndo' in files['design'] and 'dsRedo' in files['design'] and 'DS_HISTORY_LIMIT=60' in files['design'],
            'selección y transformación':'dsPointerDown' in files['design'] and 'dsPointerMove' in files['design'] and 'data-ds-handle' in files['design'],
            'capas y grupos':'dsRenderLayers' in files['design'] and 'dsGroup' in files['design'] and 'dsReorder' in files['design'],
            'alineación':'dsAlign' in files['design'] and 'dsDistribute' in files['design'],
            'snapping':'dsSnapMove' in files['design'] and 'dsGuideSvg' in files['design'],
            'PNG/DOCX':'dsPngBytes' in files['design'] and 'dsExportPng' in files['design'] and 'docxBlockNodes=async' in files['design'],
            'listo':'EI_DESIGN_STUDIO_READY' in files['design'],
          }
          for label,ok in design_checks.items():
            if not ok: raise SystemExit(f'Estudio de Diseño incompleto: {label}')

          window_checks={
            'ventanas listas':'EI_FLOATING_WINDOWS_READY' in files['windows'],
            'no modal':'aria-modal' in files['windows'] and "'false'" in files['windows'],
            'movibles':'wmBindDrag' in files['windows'],
            'redimensionables':'ResizeObserver' in files['windows'],
            'estado persistente':'localStorage' in files['windows'],
          }
          for label,ok in window_checks.items():
            if not ok: raise SystemExit(f'Gestor de ventanas incompleto: {label}')

          checks={
            'WebLLM versionado':'@mlc-ai/web-llm@0.2.85' in files['core'],
            'V84 Transformers.js':'@huggingface/transformers@3.8.1' in files['v84'],
            'V84 fallback WASM':'WASM/CPU' in files['v84'],
            'V84 OOXML':'v84ReadDocxOoxml' in files['v84'] and 'word/document.xml' in files['v84'],
            'V84 CSV canónico':'eiAiDownloadCsvTemplate' in files['v84'] and 'v84BlocksFromCanonical' in files['v84'],
            'V85 orden system':'v85ValidateMessageOrder' in files['hier'] and 'EI_AI_V85_MESSAGE_ORDER_READY' in files['hier'],
            'V86 modelo 3B':'Hermes-3-Llama-3.2-3B-q4f16_1-MLC' in files['v86'],
            'V86 modelo 8B':'Hermes-3-Llama-3.1-8B-q4f16_1-MLC' in files['v86'],
            'V86 Qwen 1.5B':'Qwen2.5-1.5B-Instruct' in files['v86'],
            'V86 respuestas profundas':"deep:{label:'Profunda',max:1500" in files['v86'],
            'V86 BM25':'function v86Bm25' in files['v86'],
            'V86 investigación':'v86ResearchKnownPack' in files['v86'] and 's.jina.ai' in files['v86'] and 'r.jina.ai' in files['v86'],
            'V86 tránsito oficial':'secretariasenado.gov.co' in files['v86'] and 'funcionpublica.gov.co' in files['v86'],
            'V86 herramientas':'data-ei-ai-action="expand"' in files['v86'] and 'data-ei-ai-action="research"' in files['v86'],
            'V86 single-flight':'v861LoadPromise' in files['hard'],
            'V86 WebLLM orden unificado':'v84Messages(userText' in files['hard'] and 'v85ValidateMessageOrder' in files['hard'],
            'V86 límite WebLLM extendido':'Math.min(1800' in files['hard'],
            'V86 lista':'window.EI_AI_V86_READY=true' in files['v86'] and 'window.EI_AI_V861_HARDENED=true' in files['hard'],
          }
          for label,ok in checks.items():
            if not ok: raise SystemExit(f'V86 incompleta: {label}')

          if '--v86-blue:#001F73' not in css['word-studio-ai-v86.css']:
            raise SystemExit('V86 CSS debe usar azul institucional')
          PY

      - name: Validate original inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for name in ('index.html','procedimiento/index.html'):
            html=Path(name).read_text(encoding='utf-8')
            scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S|re.I)
            Path('/tmp/'+name.replace('/','_')+'.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/index.html.js
          node --check /tmp/procedimiento_index.html.js

  ui-smoke:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build exact Pages candidate V90
        run: |
          mkdir -p _site
          rsync -av --delete --exclude '.git/' --exclude '.github/' --exclude '_site/' ./ _site/
          python - <<'PY'
          from pathlib import Path
          p=Path('_site/index.html'); html=p.read_text(encoding='utf-8')
          css='''
          <link rel="stylesheet" href="word-studio-pro.css?v=90">
          <link rel="stylesheet" href="word-studio-premium.css?v=90">
          <link rel="stylesheet" href="word-studio-extensions.css?v=90">
          <link rel="stylesheet" href="word-studio-diagram-builder.css?v=90">
          <link rel="stylesheet" href="word-studio-immersive.css?v=90">
          <link rel="stylesheet" href="word-studio-workspace-v76.css?v=90">
          <link rel="stylesheet" href="word-studio-design-studio.css?v=90">
          <link rel="stylesheet" href="word-studio-ai-local.css?v=90">
          <link rel="stylesheet" href="word-studio-ai-v83-fix.css?v=90">
          <link rel="stylesheet" href="word-studio-ai-v84.css?v=90">
          <link rel="stylesheet" href="word-studio-ai-v86.css?v=90">
          <link rel="stylesheet" href="word-studio-window-manager.css?v=90">
          '''
          scripts='''
          <script src="https://cdn.jsdelivr.net/npm/docx@9.7.1/dist/index.iife.js"></script>
          <script src="word-studio-01-core.js?v=90"></script><script src="word-studio-02-editor.js?v=90"></script><script src="word-studio-03-render.js?v=90"></script><script src="word-studio-04-bind.js?v=90"></script><script src="word-studio-05-docx.js?v=90"></script><script src="word-studio-23-design-studio.js?v=90"></script><script src="word-studio-06-ui.js?v=90"></script><script src="word-studio-07-premium.js?v=90"></script><script src="word-studio-08-sgc-details.js?v=90"></script><script src="word-studio-09-structure.js?v=90"></script><script src="word-studio-10-horizontal-flow.js?v=90"></script><script src="word-studio-11-flow-pro.js?v=90"></script><script src="word-studio-12-diagram-builder.js?v=90"></script><script src="word-studio-13-immersive-ui.js?v=90"></script><script src="word-studio-14-interactions.js?v=90"></script><script src="word-studio-24-window-manager.js?v=90"></script><script src="word-studio-15-ai-local.js?v=90"></script><script src="word-studio-16-document-import.js?v=90"></script><script src="word-studio-17-ai-ui.js?v=90"></script><script src="word-studio-18-ai-v84.js?v=90"></script><script src="word-studio-19-ai-v84-numbering.js?v=90"></script><script src="word-studio-20-ai-v84-hierarchy.js?v=90"></script><script src="word-studio-21-ai-v86-smart.js?v=90"></script><script src="word-studio-22-ai-v86-hardening.js?v=90"></script>
          '''
          html=html.replace('</head>',css+'\n</head>').replace('</body>',scripts+'\n</body>');p.write_text(html,encoding='utf-8')
          PY
          touch _site/.nojekyll
      - name: Install Chromium test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser smoke tests
        run: |
          python3 -m http.server 4173 --directory _site >/tmp/docs-calidad-http.log 2>&1 &
          for i in {1..30}; do if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi; sleep 1; done
          TEST_URL=http://127.0.0.1:4173 node tests/ui-smoke.mjs
          TEST_URL=http://127.0.0.1:4173 node tests/window-manager-smoke.mjs
          TEST_URL=http://127.0.0.1:4173 node tests/ai-local-smoke.mjs
          TEST_URL=http://127.0.0.1:4173 node tests/ai-v84-smoke.mjs
          TEST_URL=http://127.0.0.1:4173 node tests/ai-v86-smoke.mjs

  deploy:
    needs: [validate, ui-smoke]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare approved baseline plus Word Studio V90
        run: |
          mkdir -p _site
          rsync -av --delete --exclude '.git/' --exclude '.github/' --exclude '_site/' ./ _site/
          python - <<'PY'
          from pathlib import Path
          p=Path('_site/index.html'); html=p.read_text(encoding='utf-8')
          css='''
          <link rel="stylesheet" href="word-studio-pro.css?v=90">
          <link rel="stylesheet" href="word-studio-premium.css?v=90">
          <link rel="stylesheet" href="word-studio-extensions.css?v=90">
          <link rel="stylesheet" href="word-studio-diagram-builder.css?v=90">
          <link rel="stylesheet" href="word-studio-immersive.css?v=90">
          <link rel="stylesheet" href="word-studio-workspace-v76.css?v=90">
          <link rel="stylesheet" href="word-studio-design-studio.css?v=90">
          <link rel="stylesheet" href="word-studio-ai-local.css?v=90">
          <link rel="stylesheet" href="word-studio-ai-v83-fix.css?v=90">
          <link rel="stylesheet" href="word-studio-ai-v84.css?v=90">
          <link rel="stylesheet" href="word-studio-ai-v86.css?v=90">
          <link rel="stylesheet" href="word-studio-window-manager.css?v=90">
          '''
          scripts='''
          <script src="https://cdn.jsdelivr.net/npm/docx@9.7.1/dist/index.iife.js"></script>
          <script src="word-studio-01-core.js?v=90"></script><script src="word-studio-02-editor.js?v=90"></script><script src="word-studio-03-render.js?v=90"></script><script src="word-studio-04-bind.js?v=90"></script><script src="word-studio-05-docx.js?v=90"></script><script src="word-studio-23-design-studio.js?v=90"></script><script src="word-studio-06-ui.js?v=90"></script><script src="word-studio-07-premium.js?v=90"></script><script src="word-studio-08-sgc-details.js?v=90"></script><script src="word-studio-09-structure.js?v=90"></script><script src="word-studio-10-horizontal-flow.js?v=90"></script><script src="word-studio-11-flow-pro.js?v=90"></script><script src="word-studio-12-diagram-builder.js?v=90"></script><script src="word-studio-13-immersive-ui.js?v=90"></script><script src="word-studio-14-interactions.js?v=90"></script><script src="word-studio-24-window-manager.js?v=90"></script><script src="word-studio-15-ai-local.js?v=90"></script><script src="word-studio-16-document-import.js?v=90"></script><script src="word-studio-17-ai-ui.js?v=90"></script><script src="word-studio-18-ai-v84.js?v=90"></script><script src="word-studio-19-ai-v84-numbering.js?v=90"></script><script src="word-studio-20-ai-v84-hierarchy.js?v=90"></script><script src="word-studio-21-ai-v86-smart.js?v=90"></script><script src="word-studio-22-ai-v86-hardening.js?v=90"></script>
          '''
          html=html.replace('</head>',css+'\n</head>').replace('</body>',scripts+'\n</body>');p.write_text(html,encoding='utf-8')
          PY
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
