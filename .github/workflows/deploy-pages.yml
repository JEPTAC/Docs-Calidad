name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate additive Word Studio JavaScript
        run: |
          for f in word-studio-01-core.js word-studio-02-editor.js word-studio-03-render.js word-studio-04-bind.js word-studio-05-docx.js word-studio-06-ui.js word-studio-07-premium.js word-studio-08-sgc-details.js word-studio-09-structure.js word-studio-10-horizontal-flow.js word-studio-11-flow-pro.js word-studio-12-diagram-builder.js word-studio-13-immersive-ui.js word-studio-14-interactions.js; do
            node --check "$f"
          done
          node --check tests/ui-smoke.mjs

      - name: Lock approved SGC baseline
        run: |
          test "$(git hash-object index.html)" = "1c507f6e851d9333760178c20d95d5f7a1436bda"
          test "$(git hash-object procedimiento/index.html)" = "40e201d86fbc38a759109487da1288e5699b022d"
          test -f assets/intro.mp4
          test -f assets/happy-cat.gif
          test -f assets/footer-ei-calidad.png

      - name: Validate SGC visual contract and isolated UX
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          html = Path('index.html').read_text(encoding='utf-8')
          css_files = {
              'word-studio-pro.css': Path('word-studio-pro.css').read_text(encoding='utf-8'),
              'word-studio-premium.css': Path('word-studio-premium.css').read_text(encoding='utf-8'),
              'word-studio-extensions.css': Path('word-studio-extensions.css').read_text(encoding='utf-8'),
              'word-studio-diagram-builder.css': Path('word-studio-diagram-builder.css').read_text(encoding='utf-8'),
              'word-studio-immersive.css': Path('word-studio-immersive.css').read_text(encoding='utf-8'),
              'word-studio-workspace-v76.css': Path('word-studio-workspace-v76.css').read_text(encoding='utf-8'),
          }
          premium = css_files['word-studio-premium.css']
          ext = css_files['word-studio-extensions.css']
          builder_css = css_files['word-studio-diagram-builder.css']
          immersive_css = css_files['word-studio-immersive.css']
          workspace = css_files['word-studio-workspace-v76.css']
          details = Path('word-studio-08-sgc-details.js').read_text(encoding='utf-8')
          structure = Path('word-studio-09-structure.js').read_text(encoding='utf-8')
          horizontal = Path('word-studio-10-horizontal-flow.js').read_text(encoding='utf-8')
          flowpro = Path('word-studio-11-flow-pro.js').read_text(encoding='utf-8')
          builder = Path('word-studio-12-diagram-builder.js').read_text(encoding='utf-8')
          immersive = Path('word-studio-13-immersive-ui.js').read_text(encoding='utf-8')
          interactions = Path('word-studio-14-interactions.js').read_text(encoding='utf-8')

          checks = {
              'bandas SGC azul/amarillo': r'\.sgc-section-title\{[^}]*background:#001F73;[^}]*color:#EAC800;',
              'subtitulo SGC azul 10.8pt': r'\.sgc-subsection-title\{[^}]*color:#001F73;[^}]*font-size:10\.8pt;',
              'cuerpo SGC 10.5pt': r'\.sgc-section-content\{[^}]*font-size:10\.5pt;',
              'TOC SGC 10.5pt': r'\.sgc-toc-row\{[^}]*color:#111;[^}]*font-size:10\.5pt;',
              'control cambios azul institucional': r'\.control-change-table th\{[^}]*background:#001F73;[^}]*color:#fff;',
          }
          for label, pattern in checks.items():
              if not re.search(pattern, html, re.S):
                  raise SystemExit(f'Contrato visual roto: {label}')

          for name, css in css_files.items():
              if re.search(r'\.sgc-[A-Za-z0-9_-]+', css):
                  raise SystemExit(f'{name} no puede redefinir clases base SGC')

          if '--word-body-size:10.5pt' not in premium:
              raise SystemExit('La tipografía premium debe usar 10.5pt')
          if '.word-control-change-table th{background:#001F73!important' not in premium:
              raise SystemExit('El control de cambios debe conservar azul #001F73')
          if '.word-toc-title{color:#001F73!important}' not in premium:
              raise SystemExit('El título de la tabla de contenido debe ser azul #001F73')
          if '.word-toc-dots{' not in premium or 'radial-gradient' not in premium:
              raise SystemExit('La tabla de contenido debe conservar líderes punteados')
          if 'word-toc-title' not in details or 'word-toc-dots' not in details:
              raise SystemExit('La capa de detalle debe mantener TOC institucional')

          required_blue = [
              ('extensiones', '--ei-blue:#001F73', ext),
              ('builder css', '--diagram-blue:#001F73', builder_css),
              ('immersive css', '--v75-blue:#001F73', immersive_css),
              ('workspace V76', '--v76-blue:#001F73', workspace),
              ('builder js', "V74_BLUE='#001F73'", builder),
              ('immersive js', "V75_BLUE='#001F73'", immersive),
              ('interactions V76', "V76_BLUE='#001F73'", interactions),
          ]
          for name, needle, txt in required_blue:
              if needle not in txt:
                  raise SystemExit(f'{name} debe usar azul institucional #001F73')

          for bad in ('#175CD3','#2F80ED','#001754','#0563C1'):
              for name, txt in list(css_files.items()) + [('builder js', builder), ('immersive js', immersive), ('interactions js', interactions)]:
                  if bad.lower() in txt.lower():
                      raise SystemExit(f'Azul no institucional detectado en {name}: {bad}')

          if 'margin:0 0 2px!important' not in ext:
              raise SystemExit('El espacio entre párrafos debe permanecer compacto')
          if "V71_BLUE='#001F73'" not in structure or "V72_BLUE='#001F73'" not in horizontal or "V73_BLUE='#001F73'" not in flowpro:
              raise SystemExit('Motores de diagrama deben conservar azul institucional')
          if 'V73_MAX_NODES=24' not in flowpro or 'v73BuildRows' not in flowpro or 'v73ConnectorPath' not in flowpro or 'CONTINÚA' not in flowpro:
              raise SystemExit('El horizontal debe conservar motor serpenteante V73')
          if 'data-v74-flow-card' not in builder or 'data-v74-concept-relation' not in builder or 'dragstart' not in builder or 'v74BindDrag' not in builder:
              raise SystemExit('V74 debe conservar constructor visual y drag-and-drop')
          if 'wordContextDrawer' not in immersive or 'v75InsertMenu' not in immersive or 'v75-focus-mode' not in immersive_css:
              raise SystemExit('V75 debe conservar inspector flotante, inserción y modo enfoque')
          if 'v75-diagram-summary' not in immersive or 'v75-compact-insert' not in immersive_css or 'v75EnhanceAccordions' not in immersive:
              raise SystemExit('V75 debe conservar interfaz contextual compacta')
          if 'document.addEventListener(\'click\',v76HandleClick,true)' not in interactions:
              raise SystemExit('V76 debe usar delegación de eventos para controles dinámicos')
          if "[data-v75-open-insert]" not in interactions or "[data-v75-open-diagram]" not in interactions:
              raise SystemExit('V76 debe cubrir Insertar bloque y Abrir constructor visual')
          if 'background:var(--v76-soft)' not in workspace or 'body.v75-word-active .topbar' not in workspace:
              raise SystemExit('V76 debe conservar el workspace minimalista')
          PY

      - name: Validate premium DOCX and interaction safeguards
        run: |
          grep -q 'word-rich-editor' word-studio-07-premium.js
          grep -q 'premiumDocxRichParagraphs' word-studio-07-premium.js
          grep -q 'PREMIUM_BODY_SIZE_PT=10.5' word-studio-07-premium.js
          grep -q 'size:21' word-studio-05-docx.js
          grep -q 'word-toc-dots' word-studio-08-sgc-details.js
          grep -q 'word-control-change-table' word-studio-08-sgc-details.js
          grep -q "WORD_BLOCK_TYPES.includes('diagram')" word-studio-09-structure.js
          grep -q 'V71_BULLETS' word-studio-09-structure.js
          grep -q "type:'svg'" word-studio-09-structure.js
          grep -q 'spacing:{after:40,line:276}' word-studio-09-structure.js
          grep -q 'v73HorizontalFlowSvgData' word-studio-11-flow-pro.js
          grep -q 'V73_MAX_NODES=24' word-studio-11-flow-pro.js
          grep -q 'Constructor visual de flujograma' word-studio-12-diagram-builder.js
          grep -q 'Constructor visual de mapa conceptual' word-studio-12-diagram-builder.js
          grep -q 'v75OpenDrawer' word-studio-13-immersive-ui.js
          grep -q 'v75ToggleFocus' word-studio-13-immersive-ui.js
          grep -q 'V75_INSERT_GROUPS' word-studio-13-immersive-ui.js
          grep -q 'V76_INTERACTIONS_READY' word-studio-14-interactions.js
          test -f tests/ui-smoke.mjs

      - name: Validate original inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for name in ('index.html','procedimiento/index.html'):
              html=Path(name).read_text(encoding='utf-8')
              scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S|re.I)
              Path('/tmp/'+name.replace('/','_')+'.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/index.html.js
          node --check /tmp/procedimiento_index.html.js

  ui-smoke:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build exact Pages candidate V76
        run: |
          mkdir -p _site
          rsync -av --delete --exclude '.git/' --exclude '.github/' --exclude '_site/' ./ _site/
          python - <<'PY'
          from pathlib import Path
          p=Path('_site/index.html')
          html=p.read_text(encoding='utf-8')
          css='''
          <link rel="stylesheet" href="word-studio-pro.css?v=76">
          <link rel="stylesheet" href="word-studio-premium.css?v=76">
          <link rel="stylesheet" href="word-studio-extensions.css?v=76">
          <link rel="stylesheet" href="word-studio-diagram-builder.css?v=76">
          <link rel="stylesheet" href="word-studio-immersive.css?v=76">
          <link rel="stylesheet" href="word-studio-workspace-v76.css?v=76">
          '''
          scripts='''
          <script src="https://cdn.jsdelivr.net/npm/docx@9.7.1/dist/index.iife.js"></script>
          <script src="word-studio-01-core.js?v=76"></script>
          <script src="word-studio-02-editor.js?v=76"></script>
          <script src="word-studio-03-render.js?v=76"></script>
          <script src="word-studio-04-bind.js?v=76"></script>
          <script src="word-studio-05-docx.js?v=76"></script>
          <script src="word-studio-06-ui.js?v=76"></script>
          <script src="word-studio-07-premium.js?v=76"></script>
          <script src="word-studio-08-sgc-details.js?v=76"></script>
          <script src="word-studio-09-structure.js?v=76"></script>
          <script src="word-studio-10-horizontal-flow.js?v=76"></script>
          <script src="word-studio-11-flow-pro.js?v=76"></script>
          <script src="word-studio-12-diagram-builder.js?v=76"></script>
          <script src="word-studio-13-immersive-ui.js?v=76"></script>
          <script src="word-studio-14-interactions.js?v=76"></script>
          '''
          html=html.replace('</head>',css+'\n</head>')
          html=html.replace('</body>',scripts+'\n</body>')
          p.write_text(html,encoding='utf-8')
          PY
          touch _site/.nojekyll

      - name: Install Chromium test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Browser smoke test dynamic controls
        run: |
          python3 -m http.server 4173 --directory _site >/tmp/docs-calidad-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          TEST_URL=http://127.0.0.1:4173 node tests/ui-smoke.mjs

  deploy:
    needs: [validate, ui-smoke]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare approved baseline plus isolated Word Studio V76
        run: |
          mkdir -p _site
          rsync -av --delete --exclude '.git/' --exclude '.github/' --exclude '_site/' ./ _site/
          python - <<'PY'
          from pathlib import Path
          p=Path('_site/index.html')
          html=p.read_text(encoding='utf-8')
          css='''
          <link rel="stylesheet" href="word-studio-pro.css?v=76">
          <link rel="stylesheet" href="word-studio-premium.css?v=76">
          <link rel="stylesheet" href="word-studio-extensions.css?v=76">
          <link rel="stylesheet" href="word-studio-diagram-builder.css?v=76">
          <link rel="stylesheet" href="word-studio-immersive.css?v=76">
          <link rel="stylesheet" href="word-studio-workspace-v76.css?v=76">
          '''
          scripts='''
          <script src="https://cdn.jsdelivr.net/npm/docx@9.7.1/dist/index.iife.js"></script>
          <script src="word-studio-01-core.js?v=76"></script>
          <script src="word-studio-02-editor.js?v=76"></script>
          <script src="word-studio-03-render.js?v=76"></script>
          <script src="word-studio-04-bind.js?v=76"></script>
          <script src="word-studio-05-docx.js?v=76"></script>
          <script src="word-studio-06-ui.js?v=76"></script>
          <script src="word-studio-07-premium.js?v=76"></script>
          <script src="word-studio-08-sgc-details.js?v=76"></script>
          <script src="word-studio-09-structure.js?v=76"></script>
          <script src="word-studio-10-horizontal-flow.js?v=76"></script>
          <script src="word-studio-11-flow-pro.js?v=76"></script>
          <script src="word-studio-12-diagram-builder.js?v=76"></script>
          <script src="word-studio-13-immersive-ui.js?v=76"></script>
          <script src="word-studio-14-interactions.js?v=76"></script>
          '''
          html=html.replace('</head>',css+'\n</head>')
          html=html.replace('</body>',scripts+'\n</body>')
          p.write_text(html,encoding='utf-8')
          PY
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
